name: P4 public source fetch
on:
  push:
    branches: [agent/p4-public-source-fetch-20260919]
    paths: [.github/workflows/p4-public-source-fetch.yml]
permissions:
  contents: read
concurrency:
  group: p4-public-source-fetch-20260919
  cancel-in-progress: false
jobs:
  fetch:
    if: github.event.head_commit.message == 'chore: fetch frozen public P4 benchmark inputs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public files only and verify immutable Git blobs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          out = pathlib.Path('public_inputs')
          out.mkdir()
          entries = [
              ('reactive_v7.py', 'IMINABO1/kaggriculture', 'dfa050c46e0511896aaf756f51382dc1742eff0d', 'agent/line_v7.py', '436198f8f2b79a208b2255cd731b81251f32560b'),
              ('reactive_v7_NOTICE.md', 'IMINABO1/kaggriculture', 'dfa050c46e0511896aaf756f51382dc1742eff0d', 'NOTICE.md', '36a6a67b4b6310e8a0b11c03ceb737ecd4d1bee8'),
              ('economic_v45.py', 'yasumorishima/kaggle-competitions', 'aaf1f7be2ad458f072483a3ed3e2e2b651ec9f8a', 'kaggriculture/agents/v45_sched.py', '5db47a16bbc4df5a110e239804051d46bb4cfa7d'),
          ]
          manifest = {'kind': 'public-inputs-only', 'secrets_used': False, 'code_executed': False, 'files': [], 'failures': []}
          for name, repo, commit, path, expected in entries:
              url = f'https://raw.githubusercontent.com/{repo}/{commit}/{path}'
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'KPro-public-benchmark-inputs'})
                  with urllib.request.urlopen(request, timeout=45) as response:
                      data = response.read(2_000_001)
                  if len(data) > 2_000_000:
                      raise RuntimeError('File too large')
                  blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
                  if blob != expected:
                      raise RuntimeError(f'Blob mismatch: {blob} != {expected}')
                  data.decode('utf-8')
                  (out / name).write_bytes(data)
                  manifest['files'].append({'name': name, 'url': url, 'repo': repo, 'commit': commit, 'path': path, 'bytes': len(data), 'git_blob': blob, 'sha256': hashlib.sha256(data).hexdigest()})
              except Exception as exc:
                  manifest['failures'].append({'name': name, 'error': repr(exc)})
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          if not any(f['name'] == 'reactive_v7.py' for f in manifest['files']):
              raise SystemExit('Required opponent was not retrieved intact')
          PY
      - name: Export verified public inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4-frozen-public-inputs
          path: public_inputs/
          if-no-files-found: error
          retention-days: 7
